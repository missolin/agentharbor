[package]
name = "agentharbor"
version = "1.2.0"
description = "AgentHarbor · 智能体港 —— 多 agent 的技能与 MCP 总管"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
